[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-agent-backend"
version = "0.1.0"
description = "Multimodal emotion agent backend service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.6",
    "numpy>=1.24",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26",
    "pytest>=7.4"
]
